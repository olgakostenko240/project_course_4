{% extends "clients/base.html" %}
{% block title %}Сообщение{% endblock %}
{% block content %}

<div class="container">
    <div class="row">
        <div class="col-3">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <p class="card-text">Действительно хотите удалить {{ object.topic }}</p>
                    <div class="card-body">
                        {% csrf_token %}
                    </div>
                    <div class="card-body">
                        <button type="submit" class="btn btn-primary">Удалить</button>
                        <a class="btn btn-primary" href="{% url 'clients:message_list' %}" role="button">Отменить</a>
                    </div>

                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
