{% extends "clients/base.html" %}
{% block content %}

<div class="row text-center">
    <div class="col-10 mx-auto p-2">
        <table class="table table-bordered border-black">
            <thead>
                <tr class="table-secondary border-black">
                    <th scope="col">Email</th>
                    <th scope="col">Ф.И.О.</th>
                    <th scope="col">Комментарий</th>
                    <th scope="col">Кнопки</th>
                </tr>
            </thead>
            <tbody>
                {% for client in object_list %}
                <tr>
                    <td>{{ client.email }}</td>
                    <td>{{ client.full_name }}</td>
                    <td>{{ client.comment }}</td>
                    <td>
                        <a class="btn btn-primary" href="{% url 'clients:clients_detail' client.pk %}" role="button">Посмотреть</a>
                        <a class="btn btn-primary" href="{% url 'clients:clients_update' client.pk %}" role="button">Редактировать</a>
                        <a class="btn btn-primary" href="{% url 'clients:clients_delete' client.pk %}" role="button">Удалить</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

{% endblock %}
